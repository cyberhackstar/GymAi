server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
}
