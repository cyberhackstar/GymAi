spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false

  web:
    cors:
      allowed-origins:
        - "${FRONTEND_URL:https://gymai.neelastack.com}"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [email, profile]
            redirect-uri: ${FRONTEND_URL:https://gymai.neelastack.com}/login/oauth2/code/{registrationId}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: [user:email, read:user]
            redirect-uri: ${FRONTEND_URL:https://gymai.neelastack.com}/login/oauth2/code/{registrationId}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

logging:
  file:
    name: ${LOG_FILE:/var/log/gymai/auth-service.log}
  level:
    root: WARN
    com.gymai.auth_service: INFO
