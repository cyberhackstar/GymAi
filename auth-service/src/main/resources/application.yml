server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: ".*"

spring:
  application:
    name: auth-service
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

event:
  exchange: ${EVENT_EXCHANGE:gymai.events}
  routing:
    registration: ${REGISTRATION_ROUTING_KEY:user.registration}
    login: ${LOGIN_ROUTING_KEY:user.login}

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

logging:
  file:
    name: ${LOG_FILE:logs/auth-service.log}
  level:
    root: INFO
    com.gymai.auth_service: INFO

app:
  frontend:
    default-url: ${FRONTEND_URL:https://gymai.neelahouse.cloud}
    allowed-urls: ${FRONTEND_ALLOWED_URLS:https://gymai.neelahouse.cloud}
