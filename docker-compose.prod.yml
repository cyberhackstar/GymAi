services:
  postgres:
    image: postgres:16-alpine
    container_name: gymai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym_ai}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gymai_postgres_data:/var/lib/postgresql/data
    networks: [gymai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    container_name: gymai-redis
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - gymai_redis_data:/data
    networks: [gymai_net]
    healthcheck:
      test: >-
        CMD-SHELL redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    container_name: gymai-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - gymai_rabbitmq_data:/var/lib/rabbitmq
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  auth-service:
    image: ghcr.io/${GHCR_NAMESPACE}/gymai-auth:${IMAGE_TAG:-local}
    container_name: gymai-auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gym_ai}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://gymai.neelastack.com}
      FRONTEND_ALLOWED_URLS: ${FRONTEND_ALLOWED_URLS:-https://gymai.neelastack.com}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_SSL_ENABLED: "false"
      LOG_FILE: /var/log/gymai/auth-service.log
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  plan-service:
    image: ghcr.io/${GHCR_NAMESPACE}/gymai-plan:${IMAGE_TAG:-local}
    container_name: gymai-plan
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gym_ai}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      FRONTEND_URL: ${FRONTEND_URL:-https://gymai.neelastack.com}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      APP_ENVIRONMENT: production
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_FILE: /var/log/gymai/plan-service.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  notification-service:
    image: ghcr.io/${GHCR_NAMESPACE}/gymai-notification:${IMAGE_TAG:-local}
    container_name: gymai-notification
    environment:
      SERVER_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_SSL_ENABLED: "false"
      RABBITMQ_LISTENER_ENABLED: "true"
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      LOG_FILE: /var/log/gymai/notification-service.log
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE}/gymai-frontend:${IMAGE_TAG:-local}
    container_name: gymai-frontend
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}

  gateway:
    image: nginx:1.27-alpine
    container_name: gymai-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      plan-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GYMAI_HTTP_PORT:-4001}:80"
    volumes:
      - ./infra/nginx/gymai.conf:/etc/nginx/conf.d/default.conf:ro
      - gymai_gateway_cache:/var/cache/nginx
    networks: [gymai_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

networks:
  gymai_net:
    name: gymai_net

volumes:
  gymai_postgres_data:
    name: gymai_postgres_data
  gymai_redis_data:
    name: gymai_redis_data
  gymai_rabbitmq_data:
    name: gymai_rabbitmq_data
  gymai_gateway_cache:
    name: gymai_gateway_cache
