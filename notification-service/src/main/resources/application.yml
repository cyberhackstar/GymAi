spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        acknowledge-mode: auto
        prefetch: 10

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

event:
  exchange: ${EVENT_EXCHANGE:gymai.events}
  queue:
    email: ${EMAIL_QUEUE:gymai.email.queue}
  routing:
    registration: ${REGISTRATION_ROUTING_KEY:user.registration}
    login: ${LOGIN_ROUTING_KEY:user.login}
    order: ${ORDER_ROUTING_KEY:order.created}
    password-reset: ${PASSWORD_RESET_ROUTING_KEY:user.password.reset}

app:
  name: ${APP_NAME:GymAI}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  file:
    name: ${LOG_FILE:logs/notification-service.log}
  level:
    root: WARN
    com.gymai.notification_service: INFO
    org.springframework.amqp: WARN
